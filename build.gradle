plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.license.report)  apply true
    alias(libs.plugins.dokka)  apply false
    alias(libs.plugins.sonarqube)  apply true
}

ext.keep_test_container_alive = project.hasProperty('keep_test_container_alive') ? project.getProperty('keep_test_container_alive').toBoolean() : false

def sonarProjectKey = System.getenv("SONAR_CLOUD_PROJECT_KEY")
def sonarProjectName = System.getenv("SONAR_CLOUD_PROJECT_NAME")
def sonarProjectOrganization = System.getenv("SONAR_CLOUD_ORGANIZATION")

group 'org.eclipse.hara'

sonar {
    properties {
        property "sonar.projectKey", sonarProjectKey
        property "sonar.projectName", sonarProjectName
        property "sonar.organization", sonarProjectOrganization
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

allprojects { prj ->
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'maven-publish'
    apply plugin: 'java'
    apply plugin: "org.sonarqube"

    apply from: "$rootDir/ktlint.gradle"

    version '2.1.0'

    if (prj != rootProject) {
        group "${prj.parent.group}.${prj.parent.name}"
    }

    dependencies {
        implementation libs.kotlin.stdlib
        implementation libs.kotlin.coroutines.jdk8
        implementation libs.joda.time
    }

    // AWS CodeArtifact publishing configuration
    publishing {
        publications {
            mavenKotlin(MavenPublication) {
                from components.kotlin
            }
        }
        repositories {
            maven {
                url 'https://kynetics-578664227078.d.codeartifact.us-west-2.amazonaws.com/maven/kynetics/'
                credentials {
                    username "aws"
                    password System.env.CODEARTIFACT_AUTH_TOKEN
                }
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    jacocoTestReport {
        mustRunAfter test
        sourceSets sourceSets.main

        reports {
            xml.required = true
            html.required = true
        }
    }

    test {
        useTestNG()

        afterTest { desc, result ->
            logger.quiet "Executing test ${desc.name} [${desc.className}] with result: ${result.resultType}"
        }
    }

    sourceSets {
        integration {
            kotlin.srcDir "${prj.getProjectDir()}/src/integration/kotlin"
            resources.srcDir "${prj.getProjectDir()}/src/integration/resources"
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
        }
    }

    configurations {
        integrationImplementation.extendsFrom testImplementation
        integrationRuntimeOnly.extendsFrom testRuntimeOnly
    }

    tasks.register('integrationTest', Test) {
        group = 'verification'
        description = 'Runs the integration tests.'

        dependsOn ':waitingHawkbitServer'
        finalizedBy ':stopHawkbitServer'

        shouldRunAfter(tasks.test)

        useTestNG()

        testClassesDirs = sourceSets.integration.output.classesDirs
        classpath = sourceSets.integration.runtimeClasspath

        systemProperty("LOG_HTTP", project.findProperty("logHttp") ?: "false")
        systemProperty("LOG_INTERNAL", project.findProperty("logInternal") ?: "false")
        systemProperty("BACKOFF_INTERVAL_SECONDS", 45)
        systemProperty("FREQUENT_POLLING_WHILE_UPDATING", false)

        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"
        }

        afterTest { desc, result ->
            logger.quiet "Executing integration test ${desc.name} [${desc.className}] with result: ${result.resultType}"
        }

    }

    tasks.check {
        dependsOn tasks.test
        dependsOn tasks.integrationTest
    }
}

